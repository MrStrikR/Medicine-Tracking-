<style>
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#13242B; --muted:#5E7079; --line:#D6DFE3;
  --brand:#0E5A68; --brand-ink:#FFFFFF; --soft:#E1ECEF; --danger:#B3261E; --overlay:rgba(10,22,27,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E181C; --surface:#16252B; --ink:#E6EEF1; --muted:#8FA3AC; --line:#26383F;
    --brand:#5CC2D3; --brand-ink:#06242A; --soft:#1E3239; --danger:#FF8A80; --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E181C; --surface:#16252B; --ink:#E6EEF1; --muted:#8FA3AC; --line:#26383F;
  --brand:#5CC2D3; --brand-ink:#06242A; --soft:#1E3239; --danger:#FF8A80; --overlay:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
#app{max-width:560px;margin:0 auto;padding:20px 16px 120px}

/* header */
.top h1{margin:8px 0 0;font-size:30px;line-height:1.2;font-weight:700}
.top .sub{margin:4px 0 20px;color:var(--muted);font-size:15px}

/* home list */
.meds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.card{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);
  border-inline-start:7px solid var(--c);border-radius:14px;padding:6px 8px 6px 12px;
}

<div id="app"><div class="loading">جارٍ التحميل…</div></div>

<script>
(function(){
  var SELF_JS = document.currentScript ? document.currentScript.textContent : '';
  var SELF_CSS = ''; Array.prototype.forEach.call(document.querySelectorAll('style'), function(s){ if (!SELF_CSS && s.textContent.indexOf('--brand') > -1) SELF_CSS = s.textContent; });
  var COLORS = ['#E4572E','#2E86AB','#7A5CC9','#2F9E6F','#E0A100','#C2457A'];

  var LOC = 'ar-u-ca-gregory-nu-latn';
  var meds = {};
  var dl = null;
  var db = null, base = '', storeStatus = '';
  function storageNote(){ return db ? '' : 'البيانات محفوظة على هذا الجهاز فقط' + (storeStatus ? ' (' + storeStatus + ')' : ''); }
  var route = { name: 'home' };

  var app = document.getElementById('app');
  var layer = document.getElementById('layer');
  var toastSlot = document.getElementById('toast-slot');

  /* ---------- helpers ---------- */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function dayKey(t){ var d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function startOfDay(t){ var d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
  function fmtTime(t){ return new Date(t).toLocaleTimeString(LOC, { hour: 'numeric', minute: '2-digit' }); }
  function fmtLongDay(t){ return new Date(t).toLocaleDateString(LOC, { weekday: 'long', day: 'numeric', month: 'long' }); }
  function fmtDayTitle(t){
    var diff = Math.round((startOfDay(Date.now()) - startOfDay(t)) / 86400000);
    if (diff === 0) return 'اليوم';
    if (diff === 1) return 'أمس';
    return fmtLongDay(t);
  }
  var rtf = null;
  try { rtf = new Intl.RelativeTimeFormat(LOC, { numeric: 'auto' }); } catch(e){}
  function fmtAgo(t){
    var s = Math.round((t - Date.now()) / 1000);
    var a = Math.abs(s);
    if (!rtf) return fmtTime(t);
    if (a < 60) return rtf.format(0, 'second');
    if (a < 3600) return rtf.format(Math.round(s/60), 'minute');
    if (a < 86400) return rtf.format(Math.round(s/3600), 'hour');
    return rtf.format(Math.round(s/86400), 'day');
  }
  function timesWord(n){
    if (n === 0) return 'لم تُؤخذ اليوم';
    if (n === 1) return 'اليوم: مرة واحدة';
    if (n === 2) return 'اليوم: مرتان';
    if (n <= 10) return 'اليوم: ' + n + ' مرات';
    return 'اليوم: ' + n + ' مرة';
  }
  function countWord(n){
    if (n === 1) return 'جرعة واحدة';
    if (n === 2) return 'جرعتان';
    if (n <= 10) return n + ' جرعات';
    return n + ' جرعة';
  }
  function sortedMeds(){ return Object.keys(meds).map(function(k){return meds[k];}).sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); }); }
  function todayCount(m){ var s = startOfDay(Date.now()); return m.logs.filter(function(l){ return l.t >= s; }).length; }
  function lastLog(m){ var best = null; m.logs.forEach(function(l){ if (!best || l.t > best.t) best = l; }); return best; }
  function goal(m){ return m.times > 0 ? m.times : 0; }
  function daysWord(n, gen){ if (n === 1) return 'يوم واحد'; if (n === 2) return gen ? 'يومين' : 'يومان'; if (n <= 10) return n + ' أيام'; return n + ' يومًا'; }
  function monthsWord(n){ if (n === 1) return 'شهر واحد'; if (n === 2) return 'شهران'; if (n <= 10) return n + ' أشهر'; return n + ' شهرًا'; }
  function medStart(m){
    if (m.startDate) { var p = m.startDate.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getTime(); }
    var s = startOfDay(m.createdAt || Date.now());
    m.logs.forEach(function(l){ var d = startOfDay(l.t); if (d < s) s = d; });
    return s;
  }
  function plan(m){
    if (!(m.duration > 0)) return null;
    var D = m.duration, g = goal(m) || 1, today0 = startOfDay(Date.now()), start = medStart(m);
    var counts = {}; m.logs.forEach(function(l){ var k = dayKey(l.t); counts[k] = (counts[k] || 0) + 1; });
    var done = 0;
    for (var i = 0; i < D; i++) {
      var ds = new Date(start); ds.setDate(ds.getDate() + i);
      var t = ds.getTime(); if (t > today0) break;
      if ((counts[dayKey(t)] || 0) >= g) done++;
    }
    var elapsed = Math.max(0, Math.min(D, Math.round((today0 - start) / 86400000) + 1));
    var endD = new Date(start); endD.setDate(endD.getDate() + D - 1);
    return { D: D, done: done, pct: Math.min(100, Math.round(done / D * 100)), left: D - elapsed, end: endD.getTime(), notStarted: today0 < start, finished: today0 > endD.getTime() };
  }
  function barHtml(p){ return '<span class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + p.pct + '"><i style="width:' + p.pct + '%"></i></span>'; }
  function lateInfo(m){
    var p = plan(m); if (p && (p.finished || p.notStarted)) return null;
    var last = lastLog(m), ref = last ? last.t : medStart(m);

  }
  function planLine(m){
    var p = plan(m); if (!p) return '';
    return '<span>مدة العلاج: أنجزت ' + p.pct + '% (' + p.done + ' من ' + daysWord(p.D, true) + ')</span>' + barHtml(p);
  }
  function planBlock(m){
    var p = plan(m); if (!p) return '';
    var status = p.notStarted ? 'لم يبدأ العلاج بعد' : p.finished ? 'انتهت مدة العلاج' : p.left === 0 ? 'اليوم هو آخر يوم في العلاج' : 'المتبقي: ' + daysWord(p.left, false);
    return '<div class="plan"><div class="plan-h"><b>' + p.pct + '%</b><span>أنجزت ' + p.done + ' من ' + daysWord(p.D, true) + '</span></div>' + barHtml(p) +
      (m.durUnit === 'months' && m.durValue ? '<p>مدة العلاج: ' + monthsWord(m.durValue) + ' (' + daysWord(p.D, true) + ')</p>' : '') + '<p>' + status + '</p><p>' + (p.finished ? 'انتهى في ' : 'ينتهي في ') + esc(fmtLongDay(p.end)) + '</p></div>';
  }
  function fmtClock(hhmm){ var p = String(hhmm).split(':'); return new Date(2000, 0, 1, +p[0], +p[1]).toLocaleTimeString(LOC, { hour: 'numeric', minute: '2-digit' }); }
  function schedText(m){ return (m.schedule || []).map(fmtClock).join('، '); }
  function schedLine(m){ return m.schedule && m.schedule.length ? '<span>المواعيد: ' + esc(schedText(m)) + '</span>' : ''; }
  function isDone(m){ var g = goal(m); return g > 0 && todayCount(m) >= g; }
  function lightHtml(m){ return isDone(m) ? '<span class="light" role="img" aria-label="اكتملت جرعات اليوم"></span>' : ''; }
  function progressText(m){
    var g = goal(m), n = todayCount(m);
    if (!g) return timesWord(n);
    return isDone(m) ? 'اكتملت جرعات اليوم (' + n + ' من ' + g + ')' : 'اليوم: ' + n + ' من ' + g;
  }

  var ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></svg>';
  var ICON_CODE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>';
  var ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>';
  var ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  var ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>';

  /* ---------- storage ---------- */
  function loadSeed(){
    if (Object.keys(meds).length) return;
    var el = document.getElementById('seed'); if (!el) return;
    try { var s = JSON.parse(el.textContent); (s.meds || []).forEach(function(x){ if (x && x.id) { if (!x.logs) x.logs = []; meds[x.id] = x; } }); saveLocal(); } catch(e){}
  }

  function loadLocal(){ try { var raw = localStorage.getItem(LS_KEY); if (raw) meds = JSON.parse(raw) || {}; } catch(e){ meds = {}; } }
  function saveMed(m){
    if (db) {
      return db.doc(base + '/' + m.id).set(clone(m)).catch(function(e){ toast('(' + ((e && (e.code || e.message)) || '?') + ') تعذّر الحفظ. تحقق من الاتصال وحاول مرة أخرى.'); });
    }
    saveLocal(); return Promise.resolve();
  }
  function deleteMedStored(id){
    if (db) { return db.doc(base + '/' + id).delete().catch(function(){ toast('تعذّر الحذف. حاول مرة أخرى.'); }); }
    saveLocal(); return Promise.resolve();
  }

  /* ---------- toast ---------- */
  function toast(msg, undo){
    clearTimeout(toastTimer);
    toastSlot.innerHTML = '<div class="toast" role="status"><span>' + esc(msg) + '</span>' + (undo ? '<button id="undo">تراجع</button>' : '') + '</div>';
    if (undo) document.getElementById('undo').onclick = function(){ toastSlot.innerHTML = ''; undo(); };
    toastTimer = setTimeout(function(){ toastSlot.innerHTML = ''; }, undo ? 6000 : 3500);
  }

  /* ---------- logging ---------- */
  function addLog(medId, data){
    var m = meds[medId]; if (!m) return;
    var log = { id: newId('l'), t: data.t, dose: data.dose || '', note: data.note || '' };
    m.logs.push(log);
    saveMed(m); render();
    toast('تم تسجيل جرعة ' + m.name, function(){ removeLog(medId, log.id, true); });
  }
  function removeLog(medId, logId, quiet){
    var m = meds[medId]; if (!m) return;

    saveMed(m); render();
    if (!quiet) toast('تم حذف الجرعة');
  }

  /* ---------- dialogs ---------- */
  function closeLayer(){ layer.innerHTML = ''; }
  function openSheet(html){
    layer.innerHTML = '<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';

  }
  function confirmSheet(title, text, okLabel, onOk){
    openSheet('<h2>' + esc(title) + '</h2><p>' + esc(text) + '</p><div class="btns"><button class="btn ghost" id="c-no">إلغاء</button><button class="btn danger" id="c-ok">' + esc(okLabel) + '</button></div>');

  }

    openSheet(
      '<h2>' + (editing ? 'تعديل الدواء' : 'إضافة دواء') + '</h2>' +
      '<label class="f">اسم الدواء<input type="text" id="f-name" autocomplete="off" value="' + esc(editing ? m.name : '') + '"></label>' +

      '<label class="f">عدد مرات أخذه في اليوم<input type="number" id="f-times" inputmode="numeric" min="1" max="24" value="' + esc(editing && m.times ? m.times : 1) + '"></label>' +
      '<div class="f" style="font-size:14px;font-weight:500">مواعيد أخذ الجرعات (اختياري)<div class="sched" id="f-sched-in"></div></div>' +
      '<div class="row2"><label class="f">مدة العلاج (اختياري)<span class="dur"><input type="number" id="f-dur" inputmode="numeric" min="1" max="3650" value="' + esc(editing && (m.durValue || m.duration) ? (m.durValue || m.duration) : '') + '"><select id="f-unit"><option value="days">أيام</option><option value="months"' + (editing && m.durUnit === 'months' ? ' selected' : '') + '>أشهر</option></select></span></label><label class="f">تاريخ البدء<input type="date" id="f-start" value="' + esc(editing ? dayKey(medStart(m)) : dayKey(Date.now())) + '"></label></div>' +
      '<label class="f">ملاحظات (اختياري)<textarea id="f-note" placeholder="مثال: بعد الأكل، مرتين في اليوم">' + esc(editing ? m.note : '') + '</textarea></label>' +
      '<div class="f" style="font-size:14px;font-weight:500">اللون<div class="swatches" role="radiogroup" aria-label="اللون" style="margin-top:8px">' +
        COLORS.map(function(c){ return '<button class="sw" role="radio" aria-checked="' + (c === color) + '" aria-label="لون" data-color="' + c + '" style="--c:' + c + '"></button>'; }).join('') +
      '</div></div>' +
      '<div class="btns"><button class="btn ghost" id="s-cancel">إلغاء</button><button class="btn" id="s-save">' + (editing ? 'حفظ التعديلات' : 'إضافة الدواء') + '</button></div>'
    );
    var sheet = layer.querySelector('.sheet');
    var cur = editing && m.schedule ? m.schedule.slice() : [];
    function drawSched(){
      var n = Math.min(24, Math.max(1, parseInt(document.getElementById('f-times').value, 10) || 1));
      var box = document.getElementById('f-sched-in');
      var vals = []; box.querySelectorAll('input').forEach(function(i){ vals.push(i.value); });
      if (vals.length) cur = vals;
      var h = '';
      for (var i = 0; i < n; i++) h += '<label class="sch"><span>الجرعة ' + (i + 1) + '</span><input type="time" value="' + esc(cur[i] || '') + '"></label>';
      box.innerHTML = h;
    }
    document.getElementById('f-times').addEventListener('input', drawSched);
    drawSched();
    sheet.querySelectorAll('.sw').forEach(function(b){
      b.onclick = function(){ color = b.dataset.color; sheet.querySelectorAll('.sw').forEach(function(x){ x.setAttribute('aria-checked', x === b ? 'true' : 'false'); }); };
    });
    document.getElementById('s-cancel').onclick = closeLayer;
    document.getElementById('s-save').onclick = function(){
      var name = document.getElementById('f-name').value.trim();
      if (!name) { document.getElementById('f-name').focus(); toast('اكتب اسم الدواء أولاً'); return; }
      var dose = document.getElementById('f-dose').value.trim();
      var note = document.getElementById('f-note').value.trim();
      var times = Math.min(24, Math.max(1, parseInt(document.getElementById('f-times').value, 10) || 1));
      var schedule = []; document.querySelectorAll('#f-sched-in input').forEach(function(i){ if (i.value) schedule.push(i.value); }); schedule.sort();
      var durUnit = document.getElementById('f-unit').value;
      var durValue = Math.min(durUnit === 'months' ? 120 : 3650, parseInt(document.getElementById('f-dur').value, 10) || 0);
      var duration = 0;
      var startDate = document.getElementById('f-start').value || dayKey(Date.now());
      if (durValue > 0) {
        var sp = startDate.split('-'), s0 = new Date(+sp[0], +sp[1] - 1, +sp[2]);
        if (durUnit === 'months') {
          var tm = s0.getMonth() + durValue, e0 = new Date(s0.getFullYear(), tm, Math.min(s0.getDate(), new Date(s0.getFullYear(), tm + 1, 0).getDate()));
          duration = Math.round((e0 - s0) / 86400000);
        } else duration = durValue;
      }
      if (editing) {
        m.name = name; m.dose = dose; m.note = note; m.color = color; m.times = times; m.schedule = schedule; m.duration = duration; m.durValue = durValue; m.durUnit = durUnit; m.startDate = startDate;
        saveMed(m);
      } else {
        var nm = { id: newId('m'), name: name, dose: dose, note: note, color: color, times: times, schedule: schedule, duration: duration, durValue: durValue, durUnit: durUnit, startDate: startDate, createdAt: Date.now(), logs: [] };
        meds[nm.id] = nm; saveMed(nm);
      }
      closeLayer(); render();
    };
    setTimeout(function(){ var f = document.getElementById('f-name'); if (f && !editing) f.focus(); }, 50);
  }

  function reportView(m){
    var y = route.y, mo = route.m, now = new Date();
    var g = goal(m) || 1;
    var today0 = startOfDay(Date.now());
    var start = startOfDay(m.createdAt || Date.now());
    m.logs.forEach(function(l){ var d = startOfDay(l.t); if (d < start) start = d; });
    var counts = {};
    m.logs.forEach(function(l){ var k = dayKey(l.t); counts[k] = (counts[k] || 0) + 1; });
    var dim = new Date(y, mo + 1, 0).getDate();
    var offset = (new Date(y, mo, 1).getDay() + 1) % 7;
    var full = 0, part = 0, miss = 0, total = 0, cells = '';
    var words = { full: 'مكتمل', part: 'ناقص', miss: 'لم تؤخذ', pend: 'لم تكتمل بعد', na: '' };
    for (var i = 0; i < offset; i++) cells += '<div class="cell empty-c"></div>';
    for (var d = 1; d <= dim; d++) {
      var ds = new Date(y, mo, d).getTime(); var c = counts[dayKey(ds)] || 0; total += c;
      var cls = 'na', mark = c > 0 ? String(c) : '';
      if (ds <= today0 && ds >= start) {
        if (c >= g) { cls = 'full'; mark = '✓'; full++; }
        else if (c > 0) { cls = 'part'; mark = c + '/' + g; part++; }
        else if (ds === today0) { cls = 'pend'; mark = ''; }
        else { cls = 'miss'; mark = '✕'; miss++; }
      }
      cells += '<button class="cell ' + cls + (ds === today0 ? ' today' : '') + '" data-act="dayinfo" data-id="' + m.id + '" data-day="' + ds + '" aria-label="' + esc(fmtLongDay(ds) + (words[cls] ? ': ' + words[cls] : '')) + '"><b>' + d + '</b><i>' + mark + '</i></button>';
    }
    var wd = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
    var title = new Date(y, mo, 1).toLocaleDateString(LOC, { month: 'long', year: 'numeric' });
    var isCur = (y === now.getFullYear() && mo === now.getMonth());
    return '<div class="bar"><button class="back" data-act="home">' + ICON_BACK + 'كل الأدوية</button><button class="link" data-act="open" data-id="' + m.id + '">صفحة الدواء</button></div>' +

      (isCur ? '' : '<p class="last"><button class="link" data-act="rmonth" data-d="0">العودة إلى الشهر الحالي</button></p>') +
      '<div class="stats"><div class="stat"><b>' + full + '</b><span>أيام مكتملة</span></div><div class="stat"><b>' + part + '</b><span>أيام ناقصة</span></div><div class="stat"><b>' + miss + '</b><span>أيام فائتة</span></div></div>' +
      '<div class="cal">' + wd.map(function(n){ return '<div class="wd">' + n + '</div>'; }).join('') + cells + '</div>' +

  function saveFile(name, text, mime){
    if (dl) return dl.save({ filename: name, data: text });
    return new Promise(function(res, rej){
      function tryDownload(){
        try {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([text], { type: mime }));
          a.download = name; document.body.appendChild(a); a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
          res();
        } catch(e){ rej(e); }
      }
      try {
        var file = new File([text], name, { type: mime });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file] }).then(res).catch(function(e){
            if (e && e.name === 'AbortError') rej({ code: 'declined' }); else tryDownload();
          });
          return;
        }
      } catch(e){}
      tryDownload();
    });
  }

  function cleanMed(x){
    var okId = /^[A-Za-z0-9_.~:@+-]{1,100}$/;
    if (!x || typeof x.id !== 'string' || !okId.test(x.id) || typeof x.name !== 'string' || !x.name.trim()) return null;
    var logs = [];
    (Array.isArray(x.logs) ? x.logs : []).forEach(function(l){
      if (l && typeof l.id === 'string' && okId.test(l.id) && isFinite(+l.t)) logs.push({ id: l.id, t: +l.t, dose: String(l.dose || '').slice(0, 200), note: String(l.note || '').slice(0, 300) });
    });
    var times = Math.min(24, Math.max(0, parseInt(x.times, 10) || 0));
    var sched = (Array.isArray(x.schedule) ? x.schedule : []).filter(function(t){ return /^\d{2}:\d{2}$/.test(t); }).slice(0, 24);
    return {
      id: x.id, name: x.name.trim().slice(0, 120), dose: String(x.dose || '').slice(0, 200), note: String(x.note || '').slice(0, 500),
      color: /^#[0-9A-Fa-f]{6}$/.test(x.color || '') ? x.color : COLORS[0],
      times: times, schedule: sched,
      duration: Math.min(3650, Math.max(0, parseInt(x.duration, 10) || 0)),
      durValue: Math.min(3650, Math.max(0, parseInt(x.durValue, 10) || 0)),
      durUnit: x.durUnit === 'months' ? 'months' : 'days',
      startDate: /^\d{4}-\d{2}-\d{2}$/.test(x.startDate || '') ? x.startDate : '',
      createdAt: isFinite(+x.createdAt) ? +x.createdAt : Date.now(),
      logs: logs
    };
  }

  function importData(){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function(){
      var f = inp.files && inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function(){
        var d;
        try { d = JSON.parse(r.result); } catch(e){ toast('الملف غير صالح'); return; }
        var list = Array.isArray(d) ? d : (d && Array.isArray(d.meds) ? d.meds : null);
        if (!list || (d && d.app && d.app !== 'medication-tracker')) { toast('هذا ليس ملف بيانات هذا التطبيق'); return; }
        var addedMeds = 0, addedLogs = 0;
        list.forEach(function(raw){
          var c = cleanMed(raw); if (!c) return;
          var cur = meds[c.id];
          if (!cur) { meds[c.id] = c; addedMeds++; addedLogs += c.logs.length; saveMed(c); return; }
          var have = {}; cur.logs.forEach(function(l){ have[l.id] = 1; });
          var n = 0; c.logs.forEach(function(l){ if (!have[l.id]) { cur.logs.push(l); n++; } });
          if (n) { addedLogs += n; saveMed(cur); }
        });
        render();
        toast(addedMeds || addedLogs ? 'تم استيراد ' + addedMeds + ' من الأدوية و' + addedLogs + ' من الجرعات' : 'لا جديد في هذا الملف');
      };
      r.onerror = function(){ toast('تعذّر قراءة الملف'); };
      r.readAsText(f);
    };
    inp.click();
  }

  function exportBackup(){
    if (!dl) return;
    var now = new Date();
    var data = { app: 'medication-tracker', version: 1, exportedAt: now.toISOString(), meds: sortedMeds() };
    dl.save({ filename: 'medication-backup-' + dayKey(now.getTime()) + '.json', data: JSON.stringify(data, null, 2) })
      .then(function(){ toast('تم حفظ النسخة الاحتياطية'); })
      .catch(function(e){ if (e && e.code === 'declined') return; toast('تعذّر حفظ الملف'); });
  }

  function render(){
    if (route.name === 'report' && meds[route.id]) app.innerHTML = reportView(meds[route.id]);
    else if (route.name === 'med' && meds[route.id]) app.innerHTML = medView(meds[route.id]);
    else { route = { name: 'home' }; app.innerHTML = homeView(); }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if (!el || layer.contains(el) && el.closest('.sheet')) return;
    var act = el.dataset.act, id = el.dataset.id;
    if (act === 'add') medSheet(null);
    else if (act === 'export') exportBackup();
    else if (act === 'exportapp') exportApp();
    else if (act === 'exportdata') exportData();
    else if (act === 'importdata') importData();
    else if (act === 'report') { var nw = new Date(); go({ name: 'report', id: id, y: nw.getFullYear(), m: nw.getMonth() }); }
    else if (act === 'rmonth') {
      var dd = +el.dataset.d, base0 = new Date(), tgt = dd === 0 ? new Date(base0.getFullYear(), base0.getMonth(), 1) : new Date(route.y, route.m + dd, 1);
      route = { name: 'report', id: route.id, y: tgt.getFullYear(), m: tgt.getMonth() }; render();
    }
    else if (act === 'dayinfo') dayInfo(id, +el.dataset.day);
    else if (act === 'open') go({ name: 'med', id: id });
    else if (act === 'home') go({ name: 'home' });
    else if (act === 'quick') { var m = meds[id]; addLog(id, { t: Date.now(), dose: m.dose }); }
    else if (act === 'edit') medSheet(meds[route.id]);
    else if (act === 'delmed') {
      var mm = meds[route.id];
      confirmSheet('حذف ' + mm.name + '؟', 'سيُحذف الدواء وكل جرعاته المسجلة نهائياً.', 'حذف الدواء', function(){
        delete meds[mm.id]; deleteMedStored(mm.id); go({ name: 'home' }); toast('تم حذف الدواء');
      });
    }
    else if (act === 'dellog') {
      confirmSheet('حذف هذه الجرعة؟', 'ستُزال من السجل نهائياً.', 'حذف', function(){ removeLog(id, el.dataset.log); });
    }
    else if (act === 'addlog') {
      var date = document.getElementById('l-date').value, time = document.getElementById('l-time').value;
      if (!date || !time) { toast('اختر التاريخ والوقت'); return; }
      var t = new Date(date + 'T' + time).getTime();
      if (isNaN(t)) { toast('التاريخ أو الوقت غير صحيح'); return; }
      addLog(id, { t: t, dose: document.getElementById('l-dose').value.trim(), note: document.getElementById('l-note').value.trim() });
    }
  });

  /* ---------- init ---------- */
  async function init(){
    try {
      if (window.claude && claude.use) {
        var res = await Promise.all([claude.use('db'), claude.use('user')]);
        if (res[0] && res[1]) {
          var uid = await res[1].id();
          if (uid) { db = res[0]; base = 'data/users/' + uid; storeStatus = ''; }
        }
      }
    } catch(e){ db = null; }
    if (db) {
      try {
        var snap = await db.collection(base).get();
        snap.docs.forEach(function(d){ var v = clone(d.data()); if (!v.logs) v.logs = []; meds[d.id] = v; });
      } catch(e){ db = null; }
    }
    if (!db) { loadLocal(); loadSeed();  }
    else {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (raw) {
          var old = JSON.parse(raw) || {};
          Object.keys(old).forEach(function(k){ if (!meds[k]) { meds[k] = old[k]; if (!meds[k].logs) meds[k].logs = []; saveMed(meds[k]); } });
          localStorage.removeItem(LS_KEY);
        }
      } catch(e){}
    }
    Object.keys(meds).forEach(function(k){ if (!meds[k].logs) meds[k].logs = []; });
    try { if (window.claude && claude.use) dl = await claude.use('downloads'); } catch(e){ dl = null; }
    var m = /^#med\/(.+)$/.exec(location.hash || '');
    if (m && meds[m[1]]) route = { name: 'med', id: m[1] };
    render();
  }
  init();
})();
</script>
</body>
</html>
